<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 880" role="img" aria-labelledby="title desc">
<title id="title">CC2 FEL cable — reference orientation and electrical mapping</title>
<desc id="desc">With the heatsink above J6 and the buzzer to its right, J6 left to right is ground, D plus, D minus, five volts. USB contact four connects J6 one; USB three connects J6 two; USB two connects J6 three; USB one connects J6 four.</desc>
<style>text{font-family:Arial,sans-serif;fill:#162b3b}.title{font-size:27px;font-weight:bold}.body{font-size:20px}.small{font-size:17px}.bold{font-weight:bold}.muted{fill:#4b6172}</style>
<rect width="1120" height="880" rx="20" fill="#f4f8fb"/>
<text x="36" y="48" class="title">1. Board orientation — match the reference photo</text>
<rect x="50" y="76" width="1020" height="320" rx="14" fill="#e0ebe9" stroke="#7d9996"/>
<rect x="90" y="97" width="615" height="80" rx="8" fill="#b6c6cc" stroke="#617781"/>
<text x="295" y="145" class="body bold">HEATSINK ABOVE</text>
<rect x="90" y="210" width="140" height="125" rx="8" fill="#344e59"/>
<text x="106" y="270" class="body" style="fill:white">eMMC chip</text>
<rect x="398" y="201" width="90" height="44" rx="6" fill="#bfcdd2" stroke="#607683"/>
<text x="514" y="230" class="body">SW2 / FEL button</text>
<circle cx="897" cy="289" r="59" fill="#344e59"/>
<text x="863" y="295" class="body" style="fill:white">Buzzer</text>
<text x="270" y="288" class="small bold">J6</text>
<rect x="325" y="263" width="396" height="48" rx="5" fill="#283e4a"/>
<circle cx="368" cy="287" r="15" fill="#242b32" stroke="#778991" stroke-width="2"/><text x="368" y="342" text-anchor="middle" class="body bold">1</text><text x="368" y="372" text-anchor="middle" class="small">GND</text><circle cx="470" cy="287" r="15" fill="#15834f" stroke="#778991" stroke-width="2"/><text x="470" y="342" text-anchor="middle" class="body bold">2</text><text x="470" y="372" text-anchor="middle" class="small">D+ / DP</text><circle cx="572" cy="287" r="15" fill="#ffffff" stroke="#778991" stroke-width="2"/><text x="572" y="342" text-anchor="middle" class="body bold">3</text><text x="572" y="372" text-anchor="middle" class="small">D− / DM</text><circle cx="674" cy="287" r="15" fill="#cb3448" stroke="#778991" stroke-width="2"/><text x="674" y="342" text-anchor="middle" class="body bold">4</text><text x="674" y="372" text-anchor="middle" class="small">+5 V</text><text x="36" y="438" class="title">2. Connect by signal — USB-A plug contact numbers</text>
<text x="36" y="467" class="small muted">Electrical map below; it is NOT a drawing of the USB-A mating face.</text>
<text x="50" y="509" class="body bold">J6 position in photo</text><text x="405" y="509" class="body bold">Typical wire*</text><text x="730" y="509" class="body bold">USB-A male contact</text>
<rect x="36" y="526" width="1048" height="49" rx="8" fill="white" stroke="#d1dce3"/><text x="53" y="556" class="body bold">1 — GND</text><path d="M 300 551 H 680" stroke="#7b8e98" stroke-width="9"/><path d="M 300 551 H 680" stroke="#242b32" stroke-width="6"/><rect x="437" y="532" width="108" height="37" rx="6" fill="white" stroke="#d1dce3"/><text x="491" y="556" text-anchor="middle" class="body">Black</text><text x="733" y="556" class="body bold">4 — GND</text><rect x="36" y="584" width="1048" height="49" rx="8" fill="white" stroke="#d1dce3"/><text x="53" y="614" class="body bold">2 — D+ / DP</text><path d="M 300 609 H 680" stroke="#7b8e98" stroke-width="9"/><path d="M 300 609 H 680" stroke="#15834f" stroke-width="6"/><rect x="437" y="590" width="108" height="37" rx="6" fill="white" stroke="#d1dce3"/><text x="491" y="614" text-anchor="middle" class="body">Green</text><text x="733" y="614" class="body bold">3 — D+</text><rect x="36" y="642" width="1048" height="49" rx="8" fill="white" stroke="#d1dce3"/><text x="53" y="672" class="body bold">3 — D− / DM</text><path d="M 300 667 H 680" stroke="#7b8e98" stroke-width="9"/><path d="M 300 667 H 680" stroke="#ffffff" stroke-width="6"/><rect x="437" y="648" width="108" height="37" rx="6" fill="white" stroke="#d1dce3"/><text x="491" y="672" text-anchor="middle" class="body">White</text><text x="733" y="672" class="body bold">2 — D−</text><rect x="36" y="700" width="1048" height="49" rx="8" fill="white" stroke="#d1dce3"/><text x="53" y="730" class="body bold">4 — +5 V</text><path d="M 300 725 H 680" stroke="#7b8e98" stroke-width="9"/><path d="M 300 725 H 680" stroke="#cb3448" stroke-width="6"/><rect x="437" y="706" width="108" height="37" rx="6" fill="white" stroke="#d1dce3"/><text x="491" y="730" text-anchor="middle" class="body">Red</text><text x="733" y="730" class="body bold">1 — VBUS +5 V</text><text x="36" y="793" class="small">* Wire colours are typical only. Identify every wire by continuity with the cable unplugged.</text>
<text x="36" y="822" class="small">Mark the socket's GND end. Align that end with the LEFT pin of J6 in this reference.</text>
<text x="36" y="851" class="small bold">Assembly and continuity tests: cable disconnected from BOTH PC and board. No mains power.</text>
</svg>