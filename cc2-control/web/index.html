lts are below the target or the rounds are used up. Then save the mesh. Every step lists its printer commands and sends them only after you confirm.`,"bed.align_guide_full":`No shorter probing command is confirmed for this firmware, so every round runs the full bed mesh calibration ({command}). The mesh of the last round is the one that is saved.`,"bed.align_guide_rounds":`Round {round} of {rounds}`,"bed.align_guide_round_result":`Round {round}: tilt X {x} mm, tilt Y {y} mm`,"bed.align_guide_smaller":`The tilt got smaller since the last round.`,"bed.align_guide_not_smaller":`The tilt did not get smaller since the last round. Check which way the screws were turned.`,"bed.align_guide_turn":`Turn the screws as listed above, then measure again.`,"bed.align_guide_done":`Both tilts are below the target. Save the mesh to finish.`,"bed.align_guide_out_of_rounds":`All {rounds} rounds are used and a tilt is still above the target. Save this mesh or end the session.`,"bed.align_guide_measure":`Measure the mesh`,"bed.align_guide_measure_again":`Measure again`,"bed.align_guide_save_to":`Save to plate`,"bed.align_guide_save":`Save the mesh and finish`,"bed.align_guide_end":`End the session`,"bed.align_guide_no_plate":`There is no plate for this side in the plate library, so the mesh cannot be saved to one. It stays in the printer as the mesh of this side.`,"bed.align_guide_probing":`Probing has started. It can now only be interrupted with the emergency stop.`,"bed.align_guide_confirm_measure":`Run measurement {round} of {rounds}? The toolhead will move and the bed heats up. These commands are sent to the printer:`,"bed.align_guide_wait":`(then CC2 Control waits until the bed reads {temp} °C and holds it for {minutes} min; nothing is sent meanwhile)`,"bed.align_guide_confirm_save":`Save this mesh as the {temp} °C measurement of {name} and end the session? These commands are sent to the printer:`,"bed.align_guide_confirm_end":`End the alignment session? These commands are sent to t
