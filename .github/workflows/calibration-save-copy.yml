name: Verify calibration saving messages
on:
  push:
    branches: [fix/calibration-save-messages]
    paths: [.github/workflows/calibration-save-copy.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Check source and rebuild translated UI
        working-directory: cc2-control/web-src
        run: npm ci && npm run check && npm run build && npx playwright install --with-deps chromium
      - name: Existing PID and calibration interactions on desktop/mobile
        working-directory: cc2-control/web-src
        run: |
          npm run test:pid
          npm run test:control-calibrations
      - name: Verify rebuilt locale assets
        run: |
          python3 cc2-control/tests/test_web_sync_static.py
          python3 cc2-control/tests/test_locales_static.py
          python3 cc2-control/tests/test_locale_coverage_static.py
      - name: Commit UI and refresh final canonical snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cc2-control/web
          git commit -m 'Rebuild localized calibration saving messages'
          git rm .github/workflows/calibration-save-copy.yml
          git commit -m 'Remove temporary calibration copy verification workflow'
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current
          git commit -m 'Pin clarified calibration saving messages in source archive'
          python3 builder/current/tests/test_cc2_control_source_snapshot.py
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          git push origin HEAD:refs/heads/fix/calibration-save-messages
