name: Experimental native network compatibility
on:
  push:
    branches: [test/network-compat-r1]
    paths:
      - experimental/network-compat-r1/**
      - .github/workflows/network-compat-r1.yml
permissions:
  contents: read
jobs:
  offline-qualification:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install host and ARM qualification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user python3-venv
          python3 -m venv "$RUNNER_TEMP/net-tools"
          "$RUNNER_TEMP/net-tools/bin/pip" install ziglang==0.15.2
      - name: Core, sanitizer, C++ ABI and live ARM trampoline tests
        run: |
          CC2_ZIG=$("$RUNNER_TEMP/net-tools/bin/python" -c 'import ziglang; from pathlib import Path; print(Path(ziglang.__file__).parent/"zig")')
          export CC2_ZIG
          "$RUNNER_TEMP/net-tools/bin/python" experimental/network-compat-r1/build-ci.py
      - uses: actions/upload-artifact@v6
        with:
          name: cc2-network-compat-r1
          path: |
            experimental/network-compat-r1/output/libcc2-network-compat-r1.so
            experimental/network-compat-r1/output/validation.json
            experimental/network-compat-r1/output/required-symbol-versions.txt
          if-no-files-found: error
          retention-days: 14
