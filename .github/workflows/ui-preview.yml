name: Isolated UI preview

on:
  pull_request:
    paths:
      - 'cc2-control/web-src/**'
      - 'cc2-control/src/**'
      - '.github/workflows/ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: cc2-control/web-src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: cc2-control/web-src/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Navigate the isolated preview and capture each page
        run: npm run test:preview
        env:
          CC2_SCREENSHOTS: ${{ runner.temp }}/cc2-preview-screenshots
      - name: Verify recovery confirmation and native G-code download
        run: npm run test:recovery
      - name: Verify adaptive and saved mesh rendering
        run: npm run test:mesh
      - name: Verify camera streaming lifecycle
        run: npm run test:camera
      - name: Verify Quick Actions light telemetry and heater shutdown guards
        run: npm run test:quick
      - name: Verify timelapse selection and history deletion controls
        run: npm run test:print-history
      - name: Verify G-code filament labels and Canvas mapping
        run: npm run test:filaments
      - name: Verify mesh calibration homes an unhomed printer first
        run: npm run test:calibration
      - name: Verify the Job page asks for objects only during a print
        run: npm run test:job-objects
      - name: Browser upload and same-name reload
        run: npm run test:upload
      - name: Save screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cc2-ui-preview-screenshots
          path: ${{ runner.temp }}/cc2-preview-screenshots
          retention-days: 7
      - name: Printer report browser regression
        run: npm run test:printer-reports
