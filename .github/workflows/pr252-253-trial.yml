name: Prepare cumulative Z-arrow and calibration trial
on:
  push:
    branches: [test/pr252-253-z-arrows]
    paths: [.github/workflows/pr252-253-trial.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install ARM toolchain and emulator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf qemu-user
      - name: Check source and rebuild UI
        working-directory: cc2-control/web-src
        run: npm ci && npm run check && npm run build && npx playwright install --with-deps chromium
      - name: Prove Z regression catches the old upper/lower directions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('cc2-control/web-src/src/pages/control.tsx')
          corrected=p.read_bytes()
          p.write_bytes(subprocess.check_output(['git','show','861aa1e1fdcbfcadc90dfee945885f9365d691d2:cc2-control/web-src/src/pages/control.tsx']))
          try:
              result=subprocess.run(['node','preview/test-z-direction.mjs'],cwd='cc2-control/web-src',capture_output=True,text=True)
              assert result.returncode and 'Z direction regression' in result.stderr,result.stdout+result.stderr
              print('PASS new browser regression fails for the original inverted Z controls')
          finally:
              p.write_bytes(corrected)
          PY
      - name: Verify corrected Z arrows, PID and calibration paths
        working-directory: cc2-control/web-src
        run: |
          npm run test:z-direction
          npm run test:pid
          npm run test:control-calibrations
      - name: Verify translated UI assets
        run: |
          python3 cc2-control/tests/test_web_sync_static.py
          python3 cc2-control/tests/test_locales_static.py
      - name: Commit UI, remove temporary workflow and snapshot final sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cc2-control/web
          git commit -m 'Rebuild cumulative Z arrows and calibration messages'
          git rm .github/workflows/pr252-253-trial.yml
          git commit -m 'Remove temporary Z-arrow trial preparation workflow'
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current
          git commit -m 'Pin cumulative PR252-253 trial source snapshot'
          python3 builder/current/tests/test_cc2_control_source_snapshot.py
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          git push origin HEAD:refs/heads/test/pr252-253-z-arrows
      - name: Build and smoke-test printer ARM application
        run: |
          make -C cc2-control clean all EXTRA_CFLAGS=-Werror
          CC2_TEST_RUNNER=qemu-arm python3 cc2-control/tests/test_smoke.py cc2-control/dist/cc2-control/cc2-control
          python3 cc2-control/installer/package.py --application-only-trial --prepared cc2-control/dist/cc2-control --output output/CC2-Control-1.2.23-PR252-253-Trial-R1.zip
          git rev-parse HEAD > output/integration-head.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cc2-control-pr252-253-trial-r1
          path: |
            output/CC2-Control-1.2.23-PR252-253-Trial-R1.zip*
            output/integration-head.txt
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cc2-control-z-arrow-preview
          path: cc2-control/web-src/preview/artifacts/z-direction-*.png
          retention-days: 30
          if-no-files-found: error
