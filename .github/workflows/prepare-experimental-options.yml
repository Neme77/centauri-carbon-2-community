name: Prepare experimental options source
on:
  push:
    branches: [feature/experimental-options]
    paths: ['cc2-control/**', '.github/workflows/prepare-experimental-options.yml']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Verify experimental API, update and printer guards
        working-directory: cc2-control
        run: |
          for source in test_experiments test_app_update_guards test_history_api; do
            cc -O2 -std=c11 -Wall -Wextra -Wpedantic -Werror -D_POSIX_C_SOURCE=200809L -pthread tests/$source.c src/mqtt.c src/console.c src/control.c src/panda.c src/uds.c -o /tmp/$source -lm
            /tmp/$source
          done
          python3 tests/test_version_static.py
          python3 tests/test_cumulative_release.py
      - name: Synchronize canonical source archive and pins
        run: |
          python3 experimental/pr128-integration/sync_source.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          if ! git diff --cached --quiet; then
            git commit -m 'Sync experimental options source snapshot and builder pins'
            git push origin HEAD
          fi
