name: Prepare approved Dashboard sources
on:
  push:
    branches: [feature/dashboard-integrations-approved]
    paths: ['.github/workflows/prepare-dashboard-approved.yml']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: cc2-control/web-src/package-lock.json
      - name: Build approved production interface
        working-directory: cc2-control/web-src
        run: |
          npm ci
          npm run check
          npm run build
      - name: Commit generated UI and firmware overlay
        run: |
          cp cc2-control/web/index.html cc2-control/firmware-integration/overlay/opt/usr/cc2-control/web/index.html
          cp cc2-control/web/locales/*.json cc2-control/firmware-integration/overlay/opt/usr/cc2-control/web/locales/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cc2-control/web cc2-control/firmware-integration/overlay/opt/usr/cc2-control/web
          if ! git diff --cached --quiet; then
            git commit -m 'Build approved Dashboard and integration interface'
          fi
      - name: Align source snapshot and builder pins
        run: |
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          if ! git diff --cached --quiet; then
            git commit -m 'Align approved Dashboard source archive and builder pins'
          fi
          git push origin HEAD
