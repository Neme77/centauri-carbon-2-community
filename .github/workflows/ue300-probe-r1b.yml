name: Validate TinaLinux-compatible probe status fetch
on:
  push:
    branches: [test/usb-ethernet-ue300-probe-r1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: sh -n experimental/usb-ethernet-probe/probe.sh && shellcheck -s sh experimental/usb-ethernet-probe/probe.sh
      - run: python3 experimental/usb-ethernet-probe/test_status_fetch.py
