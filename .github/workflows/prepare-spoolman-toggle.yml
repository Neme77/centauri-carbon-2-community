name: Prepare Spoolman integration toggle
on:
  push:
    branches: [ui/spoolman-integration-toggle]
    paths: ['cc2-control/**', '.github/workflows/prepare-spoolman-toggle.yml']
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'Neme77/centauri-carbon-2-community' && github.ref == 'refs/heads/ui/spoolman-integration-toggle' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Native Spoolman pause, resume and accounting regression
        working-directory: cc2-control
        run: |
          gcc -O1 -std=c11 -Wall -Wextra -Wpedantic -Werror -D_POSIX_C_SOURCE=200809L -pthread tests/test_spoolman.c src/mqtt.c src/console.c src/control.c src/panda.c src/uds.c -o /tmp/spoolman-toggle -lm
          /tmp/spoolman-toggle
      - name: Build and check interface
        working-directory: cc2-control/web-src
        run: npm ci && npm run check && npm run build
      - name: Verify integration switch in a real browser
        working-directory: cc2-control/web-src
        run: |
          npx playwright install --with-deps chromium
          npm run test:spoolman-integration
      - name: Update generated interface and source archive
        run: |
          cp -a cc2-control/web/. cc2-control/firmware-integration/overlay/opt/usr/cc2-control/web/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cc2-control/web cc2-control/firmware-integration/overlay/opt/usr/cc2-control/web
          git diff --cached --quiet || git commit -m 'Build Spoolman integration switch interface'
          python3 experimental/pr128-integration/sync_source.py
          python3 builder/current/tests/test_cc2_control_source_snapshot.py
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          git diff --cached --quiet || git commit -m 'Align Spoolman switch source snapshot'
          git push origin HEAD:refs/heads/ui/spoolman-integration-toggle
