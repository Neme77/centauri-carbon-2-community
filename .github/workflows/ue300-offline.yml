name: UE300 offline kernel-module analysis
on:
  push:
    branches: [test/usb-ethernet-ue300-offline-r1]
permissions:
  contents: read
concurrency:
  group: ue300-offline-r1
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install host build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential bc flex bison libssl-dev libelf-dev kmod libncurses5
      - name: Compile candidate modules for analysis only
        shell: bash
        run: |
          set -o pipefail
          bash experimental/usb-ethernet-offline/build-offline.sh "$RUNNER_TEMP/ue300-offline" 2>&1 | tee offline-build.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ue300-offline-analysis-NOT-INSTALLABLE
          path: |
            ${{ runner.temp }}/ue300-offline/report/
            offline-build.log
          if-no-files-found: error
