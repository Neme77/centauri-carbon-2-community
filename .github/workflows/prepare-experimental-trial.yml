name: Prepare independent experimental options trial
on:
  push:
    branches: [feature/experimental-options]
    paths: [.github/workflows/prepare-experimental-trial.yml]
permissions:
  contents: write
concurrency:
  group: prepare-independent-experiments
  cancel-in-progress: false
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feature/experimental-options
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: cc2-control/web-src/package-lock.json
      - name: Install host and ARM tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf qemu-user busybox
      - name: Verify reproducible web build
        working-directory: cc2-control/web-src
        run: |
          npm ci
          npm run check
          npm run build
          git diff --exit-code -- ../web
      - name: Synchronize canonical source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current
          git diff --cached --quiet || git commit -m "Pin aligned independent experimental application sources"
          git push origin HEAD:refs/heads/feature/experimental-options
      - name: Native tests and builder regressions
        run: |
          make -C cc2-control clean test CROSS= CC=gcc EXTRA_CFLAGS=-Werror
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          python3 -m unittest discover -s experimental/canvas-pullback-1000 -p 'test_*.py'
      - name: Install browser
        working-directory: cc2-control/web-src
        run: npx playwright install --with-deps chromium
      - name: Experimental choices and accepted UI regressions
        working-directory: cc2-control/web-src
        run: |
          npm run test:experiments
          npm run test:motor-mode
          npm run test:canvas-states
          npm run test:canvas-layout
          npm run test:canvas-reset
          npm run test:spool-insertion
          npm run test:spools
          npm run test:updates
          npm run test:update-notice
      - name: ARM build and emulated smoke test
        run: |
          make -C cc2-control clean all EXTRA_CFLAGS=-Werror
          CC2_TEST_RUNNER=qemu-arm python3 cc2-control/tests/test_smoke.py cc2-control/dist/cc2-control/cc2-control
      - name: Package application-only development trial
        run: |
          python3 cc2-control/installer/package.py --application-only-trial --prepared cc2-control/dist/cc2-control --output output/CC2-Control-Experimental-Options-Trial-R1.zip
          git rev-parse HEAD > output/integration-head.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cc2-control-independent-experiments-trial-r1
          path: |
            output/CC2-Control-Experimental-Options-Trial-R1.zip*
            output/integration-head.txt
          if-no-files-found: error
          retention-days: 14

