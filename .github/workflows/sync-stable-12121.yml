name: Verify and pin stable 1.2.21 catalogue
on:
  push:
    branches: [release/control-1.2.21-catalog]
    paths: [.github/workflows/sync-stable-12121.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pin signed catalogue without production-code changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current
          git diff --cached --quiet || git commit -m 'Pin unified stable catalogue and legacy migration alias'
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          python3 cc2-control/tests/test_web_sync_static.py
          python3 cc2-control/tests/test_locales_static.py
          git push origin HEAD:refs/heads/release/control-1.2.21-catalog

