name: Refresh external-feed test snapshot
on:
  push:
    branches: [test/external-feed-pr241-242]
    paths: [.github/workflows/refresh-external-feed-tests.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/external-feed-pr241-242
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Verify four-card drying and connected external-feed browser paths
        working-directory: cc2-control/web-src
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run check
          npm run test:bed-drying
          npm run test:external-feed
      - name: Remove temporary workflow and regenerate final source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-external-feed-tests.yml
          git commit -m "Remove temporary test snapshot workflow"
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          git commit -m "Refresh builder snapshot after four-card browser regression fix"
          python3 builder/current/tests/test_cc2_control_source_snapshot.py
          git push origin HEAD:test/external-feed-pr241-242
