name: Prepare drying stop confirmation
on:
  push:
    branches: [fix/bed-drying-help]
    paths: [.github/workflows/prepare-drying-confirmation.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/bed-drying-help
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Validate and rebuild drying interface
        working-directory: cc2-control/web-src
        run: |
          npm ci
          npm run check
          npm run build
          npx playwright install --with-deps chromium
          npm run test:bed-drying
      - name: Commit interface and exact builder snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cc2-control/web
          git diff --cached --quiet || git commit -m "Rebuild confirmed manual drying-stop message"
          python3 experimental/pr128-integration/sync_source.py
          rm .github/workflows/prepare-drying-confirmation.yml
          git add builder/current .github/workflows/prepare-drying-confirmation.yml
          git commit -m "Refresh builder snapshot for drying stop confirmation"
      - name: Validate generated source snapshot
        run: python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
      - name: Update only the drying PR branch
        run: git push origin HEAD:refs/heads/fix/bed-drying-help
