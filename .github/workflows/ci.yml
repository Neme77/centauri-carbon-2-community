name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cc2-control:
    name: CC2 Control (host tests + ARM build)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: cc2-control
    steps:
      - uses: actions/checkout@v7

      - name: Install ARM cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Host build and tests
        run: make clean test CROSS= CC=gcc

      - name: ARM build
        run: |
          make clean all
          file dist/cc2-control/cc2-control
          file dist/cc2-control/cc2-control | grep -q 'ARM, EABI5.*statically linked'

  builder:
    name: Firmware builder (host tests)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Builder tests
        run: python3 -m unittest discover -s builder/current/tests -p 'test_*.py'

      - name: Launcher tests
        run: python3 builder/current/launch_helpers/tests/test_launcher.py
