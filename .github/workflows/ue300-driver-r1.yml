name: Validate temporary UE300 driver controls
on:
  push:
    branches: [test/usb-ethernet-ue300-driver-r1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: sh -n experimental/usb-ethernet-driver/manage.sh && shellcheck -s sh experimental/usb-ethernet-driver/manage.sh
      - run: python3 experimental/usb-ethernet-driver/test_manage.py
