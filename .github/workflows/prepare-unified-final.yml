name: Prepare final unified Control and V4.4.2 builder
on:
  push:
    branches: [test/builder-4.4.2-control-1.2.21]
    paths: [.github/workflows/prepare-unified-final.yml]
concurrency:
  group: prepare-unified-final
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          name: cc2-control-1.2.21-unified-candidate-r3
          run-id: 40082951932
          github-token: ${{ github.token }}
          path: /tmp/r3-app
      - uses: actions/download-artifact@v8
        with:
          name: cc2-builder-v4.4.2-control-1.2.21-unified-r3
          run-id: 40082951932
          github-token: ${{ github.token }}
          path: /tmp/r3-builder
      - name: Build final interface and synchronize generated sources
        run: |
          cd cc2-control/web-src
          npm ci
          npm run check
          npm run build
          cd ../..
          cp -a cc2-control/web/. cc2-control/firmware-integration/overlay/opt/usr/cc2-control/web/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cc2-control
          git diff --cached --quiet || git commit -m "Build final experimental-settings guidance"
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current
          git diff --cached --quiet || git commit -m "Pin final unified Control sources for V4.4.2 validation"
          git push origin HEAD:refs/heads/test/builder-4.4.2-control-1.2.21
      - name: Verify future signed updates and source consistency
        run: |
          python3 cc2-control/tests/test_update_verifier.py
          python3 cc2-control/tests/test_web_sync_static.py
          python3 cc2-control/tests/test_locales_static.py
          python3 builder/current/tests/test_cc2_control_source_snapshot.py
      - name: Browser regressions for source-change recovery and 1.2.21 to 1.2.22 notification
        working-directory: cc2-control/web-src
        run: |
          npx playwright install --with-deps chromium
          npm run test:experiments
          npm run test:update-notice
      - name: Reuse tested native binaries only after exact input comparison
        run: python3 .github/scripts/package-unified-final.py
      - name: Package cumulative application and source builder without firmware inputs
        run: |
          python3 builder/current/prepare_camera.py
          python3 cc2-control/installer/package.py --release --prepared /tmp/unified-prepared --camera-runtime builder/current/components/camera/runtime
          python3 .github/scripts/package-builder-camera.py --package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cc2-control-1.2.21-unified-final-r4
          path: output/CC2-Control-1.2.21-Multiplatform-Update.zip*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cc2-builder-v4.4.2-control-1.2.21-final-r4
          path: output/CC2-Builder-V4.4.2-Control-1.2.21-Test-R4.zip*
          if-no-files-found: error
          retention-days: 14