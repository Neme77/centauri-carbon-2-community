name: Diagnose isolated language preview
on:
  push:
    branches: [feature/manual-wifi-lan]
    paths: [.github/workflows/diagnose-preview-language.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 151d8227c1e6db4895ee2841ace37923baff1e88
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: cc2-control/web-src
      - name: Capture real failing navigation state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cc2-control/web-src/preview/test-polish-czech.mjs')
          s=p.read_text()
          s=s.replace("    await language.waitFor({ state: 'visible' })", """    try { await language.waitFor({ state: 'visible', timeout: 10000 }) }
              catch (error) { console.log('LANGUAGE_CASE',code,'URL',page.url(),'ERRORS',errors,'BODY',await page.locator('body').innerText()); throw error }""")
          p.write_text(s)
          PY
          node cc2-control/web-src/preview/test-polish-czech.mjs
