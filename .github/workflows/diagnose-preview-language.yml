name: Verify corrected preview fixtures and source snapshot
on:
  push:
    branches: [feature/manual-wifi-lan]
    paths: [.github/workflows/diagnose-preview-language.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b007cf5cfab5860aa242e8d9f3dc4d545cd73ef4
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: cc2-control/web-src
      - name: Run actual corrected browser fixtures
        run: npm run test:backup-language && npm run test:languages && npm run test:recovery && npm run test:upload
        working-directory: cc2-control/web-src
      - name: Verify and preserve canonical snapshot
        run: |
          set -eu
          python3 experimental/pr128-integration/sync_source.py
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          mkdir /tmp/snapshot
          cp builder/current/components/cc2-control/source/source.zip /tmp/snapshot/
          cp builder/current/prepare.py /tmp/snapshot/
          cp builder/current/core/firmware_builder.py /tmp/snapshot/
          cp builder/current/launch_helpers/run_build.py /tmp/snapshot/
          (cd /tmp/snapshot && sha256sum source.zip prepare.py firmware_builder.py run_build.py > SHA256SUMS)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-release-source-snapshot-final
          path: /tmp/snapshot/
          if-no-files-found: error
