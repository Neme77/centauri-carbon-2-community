name: Prepare bed drying help fix
on:
  push:
    branches: [fix/bed-drying-help]
    paths: [.github/workflows/prepare-bed-drying-help.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/bed-drying-help
      - name: Native heater and application regressions
        run: make -C cc2-control clean test CROSS= CC=gcc EXTRA_CFLAGS=-Werror
      - name: Synchronize builder sources and remove temporary preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 experimental/pr128-integration/sync_source.py
          rm .github/workflows/prepare-bed-drying-help.yml
          git add builder/current .github/workflows/prepare-bed-drying-help.yml
          git commit -m "Synchronize builder source snapshot for bed-drying help fix"
      - name: Builder regression
        run: python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
      - name: Publish prepared branch only
        run: git push origin HEAD:refs/heads/fix/bed-drying-help
