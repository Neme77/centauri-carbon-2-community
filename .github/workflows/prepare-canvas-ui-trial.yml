name: Prepare combined Canvas recovery and Surfoo UI trial
on:
  push:
    branches: [test/pr190-196-integration]
permissions:
  contents: write
  actions: read
concurrency:
  group: prepare-pr190-196
  cancel-in-progress: false
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: test/pr190-196-integration
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: cc2-control/web-src/package-lock.json
      - name: Install host and ARM tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf qemu-user busybox
      - run: npm ci && npm run check && npm run build
        working-directory: cc2-control/web-src
      - run: npx playwright install --with-deps chromium
        working-directory: cc2-control/web-src
      - name: Combined UI and Canvas interaction tests
        working-directory: cc2-control/web-src
        run: |
          npm run test:canvas-states
          node preview/test-ui-polish.mjs
          npm run test:preview
          npm run test:backup-language
          npm run test:update-notice
          npm run test:updates
          npm run test:bed-map
      - name: Camera component exact rollback under BusyBox
        run: CC2_TEST_SHELL='busybox sh' python3 cc2-control/tests/test_camera_component.py
      - name: Verify reproducible assets and synchronize source pins
        run: |
          git diff --exit-code -- cc2-control/web
          python3 cc2-control/tests/test_web_sync_static.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current
          git diff --cached --quiet || git commit -m "Pin combined PR190 and PR196 trial sources"
          git push origin HEAD:refs/heads/test/pr190-196-integration
      - name: Native backend and builder regressions
        run: |
          make -C cc2-control clean test CROSS= CC=gcc EXTRA_CFLAGS=-Werror
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
      - name: Build and smoke-test ARM application
        run: |
          make -C cc2-control clean all EXTRA_CFLAGS=-Werror
          CC2_TEST_RUNNER=qemu-arm python3 cc2-control/tests/test_smoke.py cc2-control/dist/cc2-control/cc2-control
      - name: Package only the application; preserve the installed camera
        run: |
          python3 cc2-control/installer/package.py --prepared cc2-control/dist/cc2-control
          git rev-parse HEAD > output/integration-head.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cc2-control-pr190-pr196-trial
          path: |
            output/CC2-Control-1.2.19-Multiplatform-Update.zip*
            output/integration-head.txt
          if-no-files-found: error
          retention-days: 14
