name: Prepare cumulative Connections candidate
on:
  push:
    branches: [feature/manual-wifi-lan]
    paths: [.github/workflows/prepare-connections-candidate.yml]
permissions:
  contents: read
concurrency:
  group: connections-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    permissions:
      contents: write # Authorized temporary job: read private draft inputs; no push or release publication.
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/manual-wifi-lan
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Retrieve and verify the exact reviewed inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api repos/Neme77/centauri-carbon-2-community/releases/assets/693727409 -H 'Accept: application/octet-stream' > /tmp/connections-source.patch.gz
          gh api repos/Neme77/centauri-carbon-2-community/releases/assets/693492332 -H 'Accept: application/octet-stream' > /tmp/connections-runtime.tar.gz
          echo "be7715d6dda6b357fb323df282a00ffb30606e5aef865c84fe9281a4c2947251  /tmp/connections-source.patch.gz" | sha256sum -c -
          echo "95db87b35dcf6799d5d57ec8ad046455c97e5cb297cc07ea4a2eeda90fb367de  /tmp/connections-runtime.tar.gz" | sha256sum -c -
          gzip -d -c /tmp/connections-source.patch.gz > /tmp/connections-source.patch
          git apply --check --whitespace=error /tmp/connections-source.patch
          git apply --whitespace=error /tmp/connections-source.patch
          echo "3368f623aa383998fa59098bfec6ba0e47ecf06def403fa0f20d75941e99b7a6  cc2-control/src/console.c" | sha256sum -c -
          git diff --stat
      - name: Install isolated test dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user busybox libdigest-sha-perl
      - name: Qualify persistent manager and startup on fixture processes
        run: sudo -n mkdir -p /output && sudo -n python3 experimental/network-connections/build_public.py
      - name: Compile the current app and test slow native Wi-Fi isolation
        run: |
          make -C cc2-control build/cc2-control CROSS= CC=gcc EXTRA_CFLAGS='-Werror -DCC2_NETWORK_STATUS_TEST=\"/tmp/cc2-network-http-test.sock\"'
          python3 experimental/network-connections/test_http.py cc2-control/build/cc2-control
      - name: Rebuild the production UI
        working-directory: cc2-control/web-src
        run: npm ci && npm run check && npm run build
      - name: Qualify actual Connections controls
        run: |
          cd cc2-control/web-src
          npx playwright install --with-deps chromium
          cd ../..
          node experimental/network-connections/test_ui.mjs cc2-control /tmp/connections-ui
      - name: Full host application regression suite
        run: make -C cc2-control clean test CROSS= CC=gcc EXTRA_CFLAGS=-Werror
      - name: Record the candidate source and refreshed snapshot locally on the isolated runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Neme77
          git config user.email 59748679+Neme77@users.noreply.github.com
          git rm .github/workflows/prepare-connections-candidate.yml
          git add .github/workflows/ci.yml .github/workflows/connections.yml CHANGELOG.md cc2-control experimental/network-connections
          git diff --cached --check
          git commit -m "Integrate qualified optional Wi-Fi and RTL8153 Connections (#266)"
          python3 experimental/pr128-integration/sync_source.py
          python3 builder/current/tests/test_cc2_control_source_snapshot.py
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          git commit -m "Refresh cumulative Connections source snapshot"
      - name: Build the final-version cumulative package for the maintainer
        run: python3 experimental/network-connections/build_candidate.py /tmp/cc2-candidate /tmp/connections-runtime.tar.gz
      - name: Preserve complete candidate history for maintainer review
        run: git bundle create /tmp/cc2-candidate/Connections-source.bundle HEAD ^9e3bffe8889cf3953fc7c89cf2fbab162e311fcb
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cc2-control-1.2.24-connections-candidate
          path: |
            /tmp/cc2-candidate/CC2-Control-*.zip
            /tmp/cc2-candidate/CC2-Control-*.zip.sha256
            /tmp/cc2-candidate/candidate-validation.json
            /tmp/cc2-candidate/Connections-source.bundle
            /tmp/connections-ui
          if-no-files-found: error
