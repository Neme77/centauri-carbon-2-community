name: Connections installer regression qualification
on:
  push:
    branches: [test/network-panel-r1]
    paths: ['experimental/network-connections/**', '.github/workflows/network-connections-temporary.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox
      - name: Native whitespace regression and real installer failure diagnostics
        run: |
          python3 experimental/network-connections/test_hooks.py
          python3 experimental/network-connections/test_install_diagnostics.py
          python3 experimental/network-connections/test_runner.py
          python3 experimental/network-connections/test_unix.py
          for f in experimental/network-connections/*.sh;do dash -n "$f";done