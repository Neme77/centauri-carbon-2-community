name: Connections panel manual trial qualification
on:
  push:
    branches: [test/network-panel-r1]
    paths: ['experimental/network-manager/**', '.github/workflows/network-manager-temporary.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user strace
          python3 -m pip install --target "$RUNNER_TEMP/zig" ziglang==0.15.2
      - name: Check manual bridge and compile with canonical GNU toolchain
        env:
          CC2_ZIG: ${{ runner.temp }}/zig/ziglang/zig
        run: python3 experimental/network-manager/build-ci.py
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: cc2-connections-manual-qualified
          path: |
            experimental/network-manager/output/cc2-network-status
            experimental/network-manager/output/validation.json
            experimental/network-manager/output/read-only-syscalls.txt
            experimental/network-manager/output/cc2-control-network-ui
            experimental/network-manager/output/integrated-sources.zip
            experimental/network-manager/output/backend-app/web/index.html
            experimental/network-manager/output/backend-app/web/locales
            experimental/network-manager/output/network-ui
          retention-days: 7
