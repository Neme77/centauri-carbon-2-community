name: Prepare cumulative Control 1.2.22 release
on:
  push:
    branches: [release/control-1.2.22]
    paths: [.github/workflows/prepare-1222.yml]
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: cc2-control/web-src/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf qemu-user busybox
      - uses: actions/download-artifact@v8
        with:
          name: cc2-camera-client-reap-r2
          run-id: 39297401612
          github-token: ${{ github.token }}
          path: /tmp/qualified-reap
      - uses: actions/download-artifact@v8
        with:
          name: cc2-camera-recovery-r2
          run-id: 39491902374
          github-token: ${{ github.token }}
          path: /tmp/qualified-recovery
      - run: npm ci && npm run check && npm run build && npx playwright install --with-deps chromium
        working-directory: cc2-control/web-src
      - run: node .github/scripts/capture-1222.mjs
      - name: Commit release previews and source snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images cc2-control/web
          git diff --cached --quiet || git commit -m 'Refresh current release previews'
          git rm .github/workflows/prepare-1222.yml .github/scripts/capture-1222.mjs
          git commit -m 'Remove temporary release preparation action'
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current
          git commit -m 'Pin Control 1.2.22 release sources'
          git push origin HEAD:refs/heads/release/control-1.2.22
      - run: make -C cc2-control clean test CROSS= CC=gcc EXTRA_CFLAGS=-Werror
      - run: python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
      - run: CC2_TEST_SHELL='busybox sh' python3 cc2-control/tests/test_camera_component.py
      - run: |
          make -C cc2-control clean all EXTRA_CFLAGS=-Werror
          CC2_TEST_RUNNER=qemu-arm python3 cc2-control/tests/test_smoke.py cc2-control/dist/cc2-control/cc2-control
          python3 .github/scripts/package-camera-update.py
          python3 cc2-control/installer/package.py --release --prepared cc2-control/dist/cc2-control --camera-runtime output/camera-runtime
          python3 experimental/canvas-pullback-kit/build_package.py output/CC2-Canvas-Pullback-Experimental-R4.zip
          git rev-parse HEAD > output/integration-head.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cc2-control-1.2.22-cumulative-release
          path: |
            output/CC2-Control-1.2.22-Multiplatform-Update.zip*
            output/CC2-Canvas-Pullback-Experimental-R4.zip*
            output/integration-head.txt
            output/camera-runtime-pins.json
          retention-days: 30
          if-no-files-found: error

# Release documentation aligned; rebuild revision 2.
# Include current experimental-integration instructions in release ZIP.
