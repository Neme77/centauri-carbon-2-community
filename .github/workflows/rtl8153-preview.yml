name: RTL8153 opt-in preview qualification
on:
  push:
    branches: [fix/rtl8153-opt-in-274]
permissions:
  contents: read
concurrency:
  group: rtl8153-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixtures:
    if: ${{ !contains(github.event.head_commit.message, '[reuse-rtl8153-candidate]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user busybox libdigest-sha-perl
      - run: sudo -n python3 experimental/network-connections/build_public.py
      - name: App HTTP regression (full host suite passed in the initial qualification)
        run: |
          make -C cc2-control build/cc2-control CROSS= CC=gcc EXTRA_CFLAGS='-Werror -DCC2_NETWORK_STATUS_TEST=\"/tmp/cc2-network-http-test.sock\"'
          python3 experimental/network-connections/test_http.py cc2-control/build/cc2-control
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[reuse-rtl8153-candidate]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev python3
      - run: python3 experimental/network-connections/abi-probe/build.py /tmp/rtl8153-probe
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rtl8153-probe
          path: |
            /tmp/rtl8153-probe/*.ko
            /tmp/rtl8153-probe/*validation.json
            /tmp/rtl8153-probe/undefined.txt
            /tmp/rtl8153-probe/modinfo.txt
  browser:
    if: ${{ !contains(github.event.head_commit.message, '[reuse-rtl8153-candidate]') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: cc2-control/web-src/package-lock.json
      - run: npm ci && npm run check && npm run build
        working-directory: cc2-control/web-src
      - run: npx playwright install --with-deps chromium
        working-directory: cc2-control/web-src
      - run: node experimental/network-connections/test_ui.mjs cc2-control /tmp/rtl8153-ui
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rtl8153-ui
          path: /tmp/rtl8153-ui
  candidate:
    needs: [fixtures, probe, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: rtl8153-probe
          path: /tmp/rtl8153-probe
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user busybox libdigest-sha-perl
      - name: Retrieve immutable published base runtime
        run: |
          curl --fail --location --retry 3 https://github.com/Neme77/centauri-carbon-2-community/releases/download/CC2-Control-1.2.24-V4.4/CC2-Connections-Runtime-R5h.tar.gz -o /tmp/base-runtime.tar.gz
      - run: python3 experimental/network-connections/prepare_usb_runtime.py /tmp/base-runtime.tar.gz /tmp/rtl8153-probe/cc2_ue300_abi_probe_3000.ko /tmp/rtl8153-runtime
      - run: python3 experimental/network-connections/build_candidate.py /tmp/rtl8153-candidate /tmp/rtl8153-runtime/CC2-Connections-Runtime-RTL8153-3000.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rtl8153-preview-candidate
          path: |
            /tmp/rtl8153-runtime
            /tmp/rtl8153-candidate/*Update.zip
            /tmp/rtl8153-candidate/*Update.zip.sha256
            /tmp/rtl8153-candidate/candidate-validation.json

  stage-draft:
    if: ${{ always() && contains(github.event.head_commit.message, '[stage-rtl8153-preview]') && (needs.candidate.result == 'success' || (contains(github.event.head_commit.message, '[reuse-rtl8153-candidate]') && needs.candidate.result == 'skipped')) }}
    needs: [candidate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: rtl8153-preview-candidate
          path: /tmp/rtl8153-qualified
          run-id: ${{ contains(github.event.head_commit.message, '[reuse-rtl8153-candidate]') && '41325456612' || github.run_id }}
          github-token: ${{ github.token }}
      - name: Retain verified component in draft and pin exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 experimental/network-connections/stage_usb_preview.py /tmp/rtl8153-qualified/rtl8153-runtime '${{ github.sha }}' '${{ github.repository }}'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rtl8153-staged-draft
          path: /tmp/rtl8153-qualified/rtl8153-runtime/staged-draft.json
