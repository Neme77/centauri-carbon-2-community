name: Compile verified cumulative ARM trial
on:
  push:
    branches: [test/cumulative-pr208-230]
    paths: [.github/workflows/compile-cumulative-arm.yml]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: test/cumulative-pr208-230
      - name: Install ARM tools with bounded repository timeouts
        run: |
          if ! command -v arm-linux-gnueabihf-gcc >/dev/null || ! command -v qemu-arm >/dev/null; then
            if ! sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gcc-arm-linux-gnueabihf qemu-user; then
              sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true update
              sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gcc-arm-linux-gnueabihf qemu-user
            fi
          fi
      - name: Compile the already validated application and run ARM smoke
        run: |
          make -C cc2-control clean all EXTRA_CFLAGS=-Werror
          CC2_TEST_RUNNER=qemu-arm python3 cc2-control/tests/test_smoke.py cc2-control/dist/cc2-control/cc2-control
      - name: Package application-only trial
        run: |
          python3 cc2-control/installer/package.py --application-only-trial --prepared cc2-control/dist/cc2-control --output output/CC2-Control-1.2.21-Cumulative-Trial-R2-Multiplatform-Update.zip
          git rev-parse HEAD > output/integration-head.txt
      - name: Remove temporary ARM build workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/compile-cumulative-arm.yml
          git add .github/workflows/compile-cumulative-arm.yml
          git commit -m "Remove completed cumulative ARM trial preparation"
          git push origin HEAD:refs/heads/test/cumulative-pr208-230
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cc2-control-cumulative-trial-r2
          path: |
            output/CC2-Control-1.2.21-Cumulative-Trial-R2-Multiplatform-Update.zip*
            output/integration-head.txt
          if-no-files-found: error
          retention-days: 14
