name: Integrate verified 1.2.24 source
on:
  push:
    branches: [feature/manual-wifi-lan]
    paths: [.github/workflows/integrate-qualified-connections.yml]
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/manual-wifi-lan
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: cc2-control-1.2.24-connections-autosave-candidate
          run-id: 41195885439
          github-token: ${{ github.token }}
          path: /tmp/qualified
      - name: Import the exact tested source and publish the reviewed PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'efe11a0f36b007bc459521ac66b91d8dbe5575f3677e4e53575b3961f978afdf  /tmp/qualified/cc2-candidate/Connections-source.bundle' | sha256sum -c -
          git bundle verify /tmp/qualified/cc2-candidate/Connections-source.bundle
          git fetch /tmp/qualified/cc2-candidate/Connections-source.bundle HEAD:refs/heads/qualified-input
          candidate=5bc8bc990297aa60290036e235a789e2d5b81b77
          test "$(git rev-parse qualified-input)" = "$candidate"
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/qualified/cc2-candidate/candidate-validation.json'))
          assert p['source_commit']=='5bc8bc990297aa60290036e235a789e2d5b81b77'
          assert p['sha256']['CC2-Control-1.2.24-Connections-Update.zip']=='f0c4f2f792468070b4439d5f64ebde849212440932caabd4d2dac071b2778dc3'
          assert p['binary_sha256']=='68741403f9041339cd9e90bea983d85211c8ead08ad2ed2771ce784573398dc0'
          PY
          git config user.name Neme77
          git config user.email 59748679+Neme77@users.noreply.github.com
          tree=$(git rev-parse "$candidate^{tree}")
          integration=$(printf '%s\n' 'Integrate physically validated Connections and pending-save fix (#266, #267)' | git commit-tree "$tree" -p "$GITHUB_SHA" -p "$candidate")
          git diff --exit-code "$candidate^{tree}" "$integration^{tree}"
          git push origin "$integration:refs/heads/feature/manual-wifi-lan"
          echo "Integrated exact qualified tree: $integration"
