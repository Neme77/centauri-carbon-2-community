name: Publish verified CC2 Control 1.2.19 assets
on:
  push:
    branches: [publish/cc2-control-1.2.19]
    paths: [.github/workflows/publish-control-1219.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Neme77/centauri-carbon-2-community
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Reconstruct exact locally signed assets from accepted CI payload
        run: python3 experimental/release-publication/publish.py
