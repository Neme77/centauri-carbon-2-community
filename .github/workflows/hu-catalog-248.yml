name: Verify Hungarian catalogue and translated source snapshot
on:
  push:
    branches: [fix/hu-catalog-248-snapshot]
    paths: [.github/workflows/hu-catalog-248.yml]
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Verify signatures and Hungarian-only catalogue correction
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createPublicKey,verify} from 'node:crypto';
          import assert from 'node:assert/strict';
          const pub=createPublicKey({key:Buffer.from('302a300506032b6570032100880999fc11cc385173a4bc6724476a3375d8d1f5f828c7c2c40db2ff0250fb2d','hex'),format:'der',type:'spki'});
          const before=execFileSync('git',['show','c06951f389bfc8ab11e7f50e7d9b056502a2e8ce:cc2-control/update-channel.cc2catalog']);
          const after=readFileSync('cc2-control/update-channel.cc2catalog');
          for(const b of [before,after]){assert(b.length<=8264);assert.equal(b.subarray(0,8).toString(),'CC2CAT1\n');assert(verify(null,Buffer.concat([b.subarray(0,8),b.subarray(72)]),pub,b.subarray(8,72)));}
          const old=JSON.parse(before.subarray(72)),next=JSON.parse(after.subarray(72));
          assert.equal(next.releases.length,2);assert.deepEqual(next.releases.map(e=>e.channel).sort(),['canvas-uds','stable']);
          const hu="TPU nyomtatása a Canvas leválasztása nélkül: választható külső tekercs a Beállítások → Integrációk → Kísérleti integrációk menüben. A PLA/TPU 95A ciklust DamiBFryta tesztelte. Konzol-, nyomtatásvégi és beállításszöveg-javítások; magyar fordítás: pezso92. A kamerajavítás csak az első aktiváláskor igényel újraindítást.";
          for(let i=0;i<next.releases.length;i++){assert.equal(next.releases[i].notes_i18n.hu,hu);next.releases[i].notes_i18n.hu=old.releases[i].notes_i18n.hu;}
          assert.deepEqual(next,old);assert.equal(readFileSync('cc2-control/VERSION','utf8').trim(),'1.2.23');
          console.log('PASS signatures, exact proposed Hungarian wording and no unrelated catalogue changes');
          JS
      - name: Reproduce missing-guide snapshot before regeneration
        run: |
          python3 - <<'PY'
          import subprocess
          p=subprocess.run(['python3','builder/current/tests/test_cc2_control_source_snapshot.py'],capture_output=True,text=True)
          assert p.returncode and 'EXTERNAL_FEED_EXPERIMENT' in p.stderr,p.stdout+p.stderr
          print('PASS new guard catches stale or missing guide before regeneration')
          PY
      - name: Remove temporary workflow and refresh exact source archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hu-catalog-248.yml
          git commit -m 'Remove temporary Hungarian catalogue verification action'
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current
          git commit -m 'Pin accented Hungarian catalogue and translated guide sources'
          python3 builder/current/tests/test_cc2_control_source_snapshot.py
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          python3 cc2-control/tests/test_web_sync_static.py
          git push origin HEAD:refs/heads/fix/hu-catalog-248-snapshot
