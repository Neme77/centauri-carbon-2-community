name: Connections qualification
on:
  pull_request:
    paths:
      - cc2-control/**
      - experimental/network-connections/**
      - .github/workflows/connections.yml
  push:
    branches: [develop, main]
    paths:
      - cc2-control/**
      - experimental/network-connections/**
      - .github/workflows/connections.yml
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user busybox libdigest-sha-perl
      - name: Persistent manager, DHCP, startup and installer regressions
        run: sudo -n python3 experimental/network-connections/build_public.py
      - name: Slow native Wi-Fi reader isolation and HTTP guards
        run: |
          make -C cc2-control build/cc2-control CROSS= CC=gcc EXTRA_CFLAGS='-Werror -DCC2_NETWORK_STATUS_TEST=\"/tmp/cc2-network-http-test.sock\"'
          python3 experimental/network-connections/test_http.py cc2-control/build/cc2-control
  browser:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: cc2-control/web-src/package-lock.json
      - name: Build the actual application UI
        working-directory: cc2-control/web-src
        run: npm ci && npm run check && npm run build
      - name: Install browser and accessibility checker
        working-directory: cc2-control/web-src
        run: |
          npx playwright install --with-deps chromium
          npm install --prefix /tmp/cc2-axe --no-package-lock axe-core@4.10.3
      - name: Actual Connections controls and persistent confirmation feedback
        run: node experimental/network-connections/test_ui.mjs cc2-control /tmp/cc2-network-ui
      - name: WCAG checks across 15 application routes and desktop/mobile
        env:
          CC2_AXE_PATH: /tmp/cc2-axe/node_modules/axe-core/axe.min.js
        run: node experimental/network-connections/test_accessibility.mjs cc2-control /tmp/cc2-network-a11y
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: connections-browser-validation
          path: |
            /tmp/cc2-network-ui
            /tmp/cc2-network-a11y
          if-no-files-found: ignore
