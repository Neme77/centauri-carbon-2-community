name: Network R2 packaged shell validation
on:
  push:
    branches: [test/network-panel-r1]
    paths: ['experimental/network-package-r2/**', '.github/workflows/network-package-r2-temporary.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify packaged shell grammar, hash binding and bounded helper
        run: |
          sh -n experimental/network-package-r2/install-on-printer.syntax.sh
          sh -n experimental/network-package-r2/install-cc2-control.sh
          sh -n experimental/network-package-r2/stage.sh
          sh -n experimental/network-panel-r1/manual-trial/manage.sh
          sh -n experimental/network-panel-r1/manual-trial/preflight.sh
          python3 experimental/network-panel-r1/test_installer_http.py
          python3 experimental/network-panel-r1/test_network_package_checks.py
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('experimental/network-package-r2/install-on-printer.syntax.sh').read_text()
          assert re.findall(r'^EXPECTED=([0-9a-f]{64})$',p,re.M)==['3b40ae6dd0d5627209560dfb3eb7a32e4a30c88ef56082e025377b3a0f2c6ef8']
          assert p.count('wget -qO-')==1
          assert p.count('installer_http_get http://127.0.0.1:8081/')==4
          print('PASS: exact candidate hash and all bounded health call sites')
          PY
