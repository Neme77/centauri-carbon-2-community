name: Prepare external feed cumulative trial
on:
  push:
    branches: [test/external-feed-pr241-242]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/test/external-feed-pr241-242'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Native source guards regression
        working-directory: cc2-control
        run: |
          gcc -O1 -std=c11 -Wall -Wextra -Wpedantic -Werror -D_POSIX_C_SOURCE=200809L -pthread tests/test_external_feed.c src/mqtt.c src/console.c src/control.c src/panda.c src/uds.c -o /tmp/test-external-feed -lm
          /tmp/test-external-feed
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: cc2-control/web-src/package-lock.json
      - name: Validate and rebuild cumulative UI
        working-directory: cc2-control/web-src
        run: |
          npm ci
          npm run check
          npm run build
          npx playwright install --with-deps chromium
          npm run test:external-feed
          node preview/test-external-filament.mjs
          npm run test:print-completion
      - name: Commit rebuilt UI and remove temporary workflow
        run: |
          git config user.name 'Neme77'
          git config user.email '59748679+Neme77@users.noreply.github.com'
          git rm .github/workflows/prepare-external-feed-trial.yml
          git add cc2-control/web
          git commit -m 'Rebuild cumulative external-feed UI and remove preparation workflow'
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          git commit -m 'Refresh source snapshot for cumulative external-feed trial'
          for attempt in 1 2 3; do
            git push origin HEAD:test/external-feed-pr241-242 && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 2
          done
      - name: Host regression suite and builder snapshot
        run: |
          make -C cc2-control clean test CROSS= CC=gcc EXTRA_CFLAGS=-Werror
          python3 builder/current/tests/test_cc2_control_source_snapshot.py
      - name: Install ARM cross-compiler and emulator
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user
      - name: Build and verify ARM application
        run: |
          make -C cc2-control clean all EXTRA_CFLAGS=-Werror
          CC2_TEST_RUNNER=qemu-arm python3 cc2-control/tests/test_smoke.py cc2-control/dist/cc2-control/cc2-control
      - name: Package application-only cumulative trial
        run: |
          python3 cc2-control/installer/package.py --application-only-trial --prepared cc2-control/dist/cc2-control --output output/CC2-Control-1.2.22-External-Feed-PR241-243-Trial-R1.zip
          sha256sum output/CC2-Control-1.2.22-External-Feed-PR241-243-Trial-R1.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: external-feed-cumulative-trial-r1
          path: output/CC2-Control-1.2.22-External-Feed-PR241-243-Trial-R1.zip*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: external-feed-preview
          path: cc2-control/web-src/preview/artifacts/external-feed-*.png
          if-no-files-found: ignore
