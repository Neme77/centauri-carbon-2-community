name: Publish verified CC2 Control 1.2.23
on:
  push:
    branches: [publish/control-1.2.23]
    paths: [.github/workflows/publish-1223.yml]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Neme77/centauri-carbon-2-community
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Verify checked main, package and signatures before publishing
        run: python3 experimental/release-publication/publish.py
      - name: Remove temporary publication action
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-1223.yml
          git commit -m 'Remove completed 1.2.23 publication workflow'
          git push origin HEAD:refs/heads/publish/control-1.2.23
