name: Camera tester support checks
on:
  push:
    branches: [test/camera-recovery-testers]
    paths:
      - experimental/camera-tester-kit/**
      - .github/workflows/camera-tester-kit.yml
permissions:
  contents: read
jobs:
  report-privacy:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install BusyBox for printer-shell compatibility fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox
      - name: Check diagnostic privacy and absence of service/network actions
        run: |
          sh -n experimental/camera-tester-kit/cc2-camera-tester-report.sh
          python3 experimental/camera-tester-kit/test_report.py
