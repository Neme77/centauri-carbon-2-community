name: Pin published Control 1.2.23 catalogue
on:
  push:
    branches: [release/control-1.2.23-catalog]
    paths: [.github/workflows/catalog-1223.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Verify published signed package and both catalogue routes
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createPublicKey,verify,createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const key=createPublicKey({key:Buffer.from('302a300506032b6570032100880999fc11cc385173a4bc6724476a3375d8d1f5f828c7c2c40db2ff0250fb2d','hex'),format:'der',type:'spki'});
          const cat=readFileSync('cc2-control/update-channel.cc2catalog');
          assert(cat.length<=8264 && cat.subarray(0,8).toString()==='CC2CAT1\n');
          assert(verify(null,Buffer.concat([cat.subarray(0,8),cat.subarray(72)]),key,cat.subarray(8,72)));
          const idx=JSON.parse(cat.subarray(72));assert.equal(idx.releases.length,2);
          assert.deepEqual(idx.releases.map(e=>e.channel).sort(),['canvas-uds','stable']);
          const url='https://github.com/Neme77/centauri-carbon-2-community/releases/download/CC2-Control-1.2.23-V4.4/CC2-Control-1.2.23-V4.4.cc2update';
          const response=await fetch(url);assert(response.ok);const app=Buffer.from(await response.arrayBuffer());
          assert.equal(createHash('sha256').update(app).digest('hex'),'02f4a355e99a08889caa4918c7104b467a89918bc90a733aa058bf30596b3051');
          const n=app.readUInt32BE(8);assert(verify(null,Buffer.concat([app.subarray(0,20),app.subarray(84,84+n)]),key,app.subarray(20,84)));
          const m=Object.fromEntries(app.subarray(84,84+n).toString().trim().split('\n').map(x=>x.split('=')));
          assert.equal(m.version,'1.2.23');assert.equal(m.sha512,createHash('sha512').update(app.subarray(84+n)).digest('hex'));
          for(const e of idx.releases){assert.equal(e.version,'1.2.23');assert.equal(e.firmware,'4.4');assert.equal(e.url,url);assert.equal(e.size,app.length);}
          console.log('PASS published payload and signed stable/legacy routes');
          JS
      - name: Remove temporary action and refresh exact source snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/catalog-1223.yml
          git commit -m 'Remove temporary 1.2.23 catalogue action'
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current
          git commit -m 'Pin published Control 1.2.23 stable catalogue'
          python3 builder/current/tests/test_cc2_control_source_snapshot.py
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          python3 cc2-control/tests/test_web_sync_static.py
          git push origin HEAD:refs/heads/release/control-1.2.23-catalog
