name: Prepare experiment action alignment
on:
  push:
    branches: [fix/experiment-card-actions]
    paths: [.github/workflows/prepare-experiment-actions.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/experiment-card-actions
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Build and verify desktop and phone geometry
        working-directory: cc2-control/web-src
        run: |
          npm ci
          npm run check
          npm run build
          npx playwright install --with-deps chromium
          npm run test:bed-drying
          npm run test:experiments
      - name: Retain visual evidence and restore unrelated recorded fixtures
        run: |
          mkdir -p output
          cp cc2-control/web-src/preview/artifacts/experiment-actions-*.png output/
          git restore --worktree cc2-control/web-src/preview/artifacts
      - name: Commit interface and exact source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cc2-control/web
          git commit -m "Rebuild aligned experimental card controls"
          python3 experimental/pr128-integration/sync_source.py
          rm .github/workflows/prepare-experiment-actions.yml
          git add builder/current .github/workflows/prepare-experiment-actions.yml
          git commit -m "Refresh builder source for aligned experimental controls"
      - name: Verify generated source snapshot
        run: python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
      - name: Publish the prepared PR branch only
        run: git push origin HEAD:refs/heads/fix/experiment-card-actions
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: experiment-card-alignment
          path: output/experiment-actions-*.png
          if-no-files-found: error
