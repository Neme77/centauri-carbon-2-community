name: Prepare Canvas layout source
on:
  push:
    branches: [feature/canvas-layout-integration]
    paths: ['cc2-control/**', '.github/workflows/prepare-canvas-layout.yml']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Synchronize canonical source archive and pins
        run: |
          python3 experimental/pr128-integration/sync_source.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          if ! git diff --cached --quiet; then
            git commit -m 'Sync Canvas layout source snapshot and builder pins'
            git push origin HEAD
          fi
