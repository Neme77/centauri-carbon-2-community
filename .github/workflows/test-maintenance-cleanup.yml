name: Test scoped CC2 maintenance cleanup
on:
  push:
    branches: [test/builder-4.4.2-control-1.2.21]
    paths: [.github/workflows/test-maintenance-cleanup.yml, .github/scripts/cc2-cleanup.sh, .github/scripts/test-cc2-cleanup.py]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Native shell fixtures with no printer access
        run: python3 .github/scripts/test-cc2-cleanup.py .github/scripts/cc2-cleanup.sh
      - name: Install BusyBox for printer shell validation
        timeout-minutes: 3
        run: sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq busybox
      - name: BusyBox shell fixtures with no printer access
        run: CC2_TEST_SHELL='busybox sh' python3 .github/scripts/test-cc2-cleanup.py .github/scripts/cc2-cleanup.sh
