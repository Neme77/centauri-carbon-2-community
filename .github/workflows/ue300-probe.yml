name: Validate UE300 temporary probe wrapper
on:
  push:
    branches: [test/usb-ethernet-ue300-probe-r1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Shell syntax and static checks
        run: |
          sh -n experimental/usb-ethernet-probe/probe.sh
          shellcheck -s sh experimental/usb-ethernet-probe/probe.sh
      - name: Refuse incompatible hosts before any module loading
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe-mock-bin"
          printf '#!/bin/sh\necho UNSAFE_INSMOD_CALLED\nexit 99\n' > "$RUNNER_TEMP/probe-mock-bin/insmod"
          chmod +x "$RUNNER_TEMP/probe-mock-bin/insmod"
          export PATH="$RUNNER_TEMP/probe-mock-bin:$PATH"
          for mode in check probe; do
            if sh experimental/usb-ethernet-probe/probe.sh "$mode" > "$RUNNER_TEMP/probe-$mode.log" 2>&1; then exit 1; fi
            grep -q 'Not the qualified ARMv7 printer' "$RUNNER_TEMP/probe-$mode.log"
            if grep -q UNSAFE_INSMOD_CALLED "$RUNNER_TEMP/probe-$mode.log"; then exit 1; fi
          done
          printf '#!/bin/sh\nif [ "$1" = -m ]; then echo armv7l; else echo 5.4.62; fi\n' > "$RUNNER_TEMP/probe-mock-bin/uname"
          chmod +x "$RUNNER_TEMP/probe-mock-bin/uname"
          if sh experimental/usb-ethernet-probe/probe.sh probe > "$RUNNER_TEMP/probe-kernel.log" 2>&1; then exit 1; fi
          grep -q 'Kernel release differs' "$RUNNER_TEMP/probe-kernel.log"
          if grep -q UNSAFE_INSMOD_CALLED "$RUNNER_TEMP/probe-kernel.log"; then exit 1; fi
          echo 'PASS shell checks and fail-closed host/release guards; no module loaded'
