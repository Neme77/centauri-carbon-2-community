name: Prepare signed-catalog experimental release candidate
on:
  push:
    branches: [test/control-1.2.20-experimental]
    paths: [.github/workflows/prepare-experimental-release.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: prepare-experimental-release-120
  cancel-in-progress: false
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: test/control-1.2.20-experimental
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: cc2-control/web-src/package-lock.json
      - name: Install host and ARM tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf qemu-user busybox
      - name: Prepare localized channel selection and cumulative notes
        run: python3 .github/scripts/prepare-experimental-release.py
      - name: Build and synchronize application sources
        run: |
          cd cc2-control/web-src
          npm ci
          npm run check
          npm run build
          cd ../..
          cp -a cc2-control/web/. cc2-control/firmware-integration/overlay/opt/usr/cc2-control/web/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cc2-control
          git diff --cached --quiet || git commit -m "Build experimental channel selection and cumulative operator notes"
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current
          git diff --cached --quiet || git commit -m "Pin experimental application release sources"
          git push origin HEAD:refs/heads/test/control-1.2.20-experimental
      - name: Native, builder and camera transaction checks
        run: |
          make -C cc2-control clean test CROSS= CC=gcc EXTRA_CFLAGS=-Werror
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          CC2_TEST_SHELL='busybox sh' python3 cc2-control/tests/test_camera_component.py
      - name: Install browser
        working-directory: cc2-control/web-src
        run: npx playwright install --with-deps chromium
      - name: Channel, opt-in and update interaction regressions
        working-directory: cc2-control/web-src
        run: |
          npm run test:experimental-channel
          npm run test:experiments
          npm run test:updates
          npm run test:update-notice
          npm run test:canvas-states
          npm run test:canvas-layout
          npm run test:spool-insertion
      - name: ARM build and emulated smoke test
        run: |
          make -C cc2-control clean all EXTRA_CFLAGS=-Werror
          CC2_TEST_RUNNER=qemu-arm python3 cc2-control/tests/test_smoke.py cc2-control/dist/cc2-control/cc2-control
      - uses: actions/download-artifact@v8
        with:
          name: cc2-camera-client-reap-r2
          run-id: 39297401612
          github-token: ${{ github.token }}
          path: /tmp/qualified-reap
      - uses: actions/download-artifact@v8
        with:
          name: cc2-camera-recovery-r2
          run-id: 39491902374
          github-token: ${{ github.token }}
          path: /tmp/qualified-recovery
      - name: Package unchanged qualified camera libraries cumulatively
        run: |
          python3 .github/scripts/package-camera-update.py
          git rev-parse HEAD > output/integration-head.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cc2-control-1.2.20-experimental-cumulative
          path: |
            output/CC2-Control-1.2.20-Multiplatform-Update.zip*
            output/integration-head.txt
            output/camera-runtime-pins.json
          if-no-files-found: error
          retention-days: 14
