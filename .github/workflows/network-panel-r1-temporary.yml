name: Network panel read-only qualification
on:
  push:
    branches: [test/network-panel-r1]
    paths: ['experimental/network-panel-r1/**', '.github/workflows/network-panel-r1-temporary.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user strace
          python3 -m pip install --target "$RUNNER_TEMP/zig" ziglang==0.15.2
      - name: Check and cross-compile read-only collector
        env:
          CC2_ZIG: ${{ runner.temp }}/zig/ziglang/zig
        run: python3 experimental/network-panel-r1/build-ci.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: cc2-network-panel-ui-r1-qualified
          path: |
            experimental/network-panel-r1/output/cc2-network-status
            experimental/network-panel-r1/output/validation.json
            experimental/network-panel-r1/output/read-only-syscalls.txt
            experimental/network-panel-r1/output/cc2-control-network-ui
            experimental/network-panel-r1/output/integrated-sources.zip
            experimental/network-panel-r1/output/backend-app/web/index.html
            experimental/network-panel-r1/output/backend-app/web/locales
            experimental/network-panel-r1/output/network-ui
          retention-days: 7
