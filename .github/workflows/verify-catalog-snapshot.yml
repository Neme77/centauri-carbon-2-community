name: Verify signed catalog source snapshot
on:
  push:
    branches: [release/cc2-control-1.2.24]
    paths: [.github/workflows/verify-catalog-snapshot.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 09f621cd0993a05280fef18ca9cdf4a44c371b61
          fetch-depth: 0
      - name: Generate and test catalog snapshot without publishing
        run: |
          set -eu
          python3 experimental/pr128-integration/sync_source.py
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          python3 cc2-control/tests/test_web_sync_static.py
          mkdir /tmp/snapshot
          cp builder/current/components/cc2-control/source/source.zip /tmp/snapshot/
          cp builder/current/prepare.py /tmp/snapshot/
          cp builder/current/core/firmware_builder.py /tmp/snapshot/
          cp builder/current/launch_helpers/run_build.py /tmp/snapshot/
          (cd /tmp/snapshot && sha256sum source.zip prepare.py firmware_builder.py run_build.py > SHA256SUMS)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-catalog-source-snapshot
          path: /tmp/snapshot/
          if-no-files-found: error
