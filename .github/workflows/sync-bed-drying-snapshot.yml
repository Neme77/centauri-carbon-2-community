name: Align bed drying source snapshot
on:
  push:
    branches: [feature/experimental-bed-drying]
    paths: [.github/workflows/sync-bed-drying-snapshot.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/experimental-bed-drying
          fetch-depth: 1
      - name: Regenerate pinned source only
        run: |
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align bed heating builder source snapshot'
          git push origin HEAD:refs/heads/feature/experimental-bed-drying
