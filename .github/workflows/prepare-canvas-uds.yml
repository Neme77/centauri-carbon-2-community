name: Prepare opt-in Canvas UDS port
on:
  push:
    branches: [experimental/canvas-uds]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experimental/canvas-uds
          fetch-depth: 0
      - name: Synchronize only the canonical source archive and references
        run: |
          python3 experimental/pr128-integration/sync_source.py
          python3 builder/current/tests/test_cc2_control_source_snapshot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          if ! git diff --cached --quiet; then
            git commit -m "Pin opt-in Canvas UDS source snapshot"
            git push origin HEAD:experimental/canvas-uds
          fi
      - name: Host build and complete native regression suite
        working-directory: cc2-control
        run: make clean test CROSS= CC=gcc EXTRA_CFLAGS=-Werror
      - name: Install ARM compiler and emulator
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user
      - name: ARM build and smoke
        working-directory: cc2-control
        run: |
          make clean all EXTRA_CFLAGS=-Werror
          CC2_TEST_RUNNER=qemu-arm python3 tests/test_smoke.py dist/cc2-control/cc2-control
      - name: Save build provenance
        run: |
          git rev-parse HEAD > cc2-control/dist/cc2-control/SOURCE-COMMIT.txt
          sha256sum cc2-control/dist/cc2-control/cc2-control > cc2-control/dist/cc2-control/BINARY-SHA256.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cc2-control-canvas-uds-qualified-build
          path: cc2-control/dist/cc2-control/
          if-no-files-found: error
