name: Prepare remembered LAN code snapshot
on:
  push:
    branches: [feature/remember-lan-code]
    paths: [.github/workflows/prepare-remember-lan.yml]
permissions:
  contents: write
concurrency:
  group: prepare-remember-lan-225
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.repository == 'Neme77/centauri-carbon-2-community' && github.ref == 'refs/heads/feature/remember-lan-code' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Regenerate and verify the exact application source snapshot
        run: |
          python3 experimental/pr128-integration/sync_source.py
          git diff --exit-code 5c9d655304b4f1c68953c83ae754727576d2e101 -- cc2-control
          python3 -c "from pathlib import Path; import subprocess,zipfile; paths=subprocess.check_output(['git','ls-files','cc2-control'],text=True).splitlines(); archive=zipfile.ZipFile('builder/current/components/cc2-control/source/source.zip'); assert archive.testzip() is None; assert sorted(archive.namelist())==sorted(p.removeprefix('cc2-control/') for p in paths); assert all(archive.read(p.removeprefix('cc2-control/'))==Path(p).read_bytes() for p in paths); print('PASS: every snapshot member matches the authorized canonical source commit',len(paths))"
          sha256sum builder/current/components/cc2-control/source/source.zip
          python3 builder/current/tests/test_cc2_control_source_snapshot.py
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          git diff --check
      - name: Commit only the generated snapshot and checksum references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          git diff --cached --quiet || git commit -m "Align remembered LAN code builder source snapshot"
          git push origin HEAD:refs/heads/feature/remember-lan-code
