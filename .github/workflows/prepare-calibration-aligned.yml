name: Align validated long calibration source
on:
  push:
    branches: [fix/calibration-bed-soak-aligned]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove temporary workflow and regenerate source snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-calibration-aligned.yml
          git commit -m "Remove completed calibration alignment workflow"
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          git commit -m "Refresh source snapshot for validated long calibration soaks"
          python3 builder/current/tests/test_cc2_control_source_snapshot.py
          git push origin HEAD:fix/calibration-bed-soak-aligned
