name: Prepare unified Control 1.2.21 and V4.4.2 builder
# Unified trial R3 documentation and same-version install instructions: stable application updates and independent guarded experimental choices.
on:
  push:
    branches: [test/builder-4.4.2-control-1.2.21]
    paths: [.github/workflows/prepare-builder-camera.yml]
concurrency:
  group: prepare-builder-camera-1.2.21
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Early firmware boot fixtures before dependency setup
        run: python3 builder/current/tests/test_camera_firmware.py
      - name: Validate canonical camera shell sources
        run: python3 -c "from pathlib import Path; paths=list(Path('cc2-control/installer/camera').glob('*.sh')); assert all(b'\\r' not in p.read_bytes() for p in paths)"
      - name: Check release numbering before dependency setup
        run: python3 builder/current/tests/test_firmware_updater.py
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install test tools, not firmware build inputs
        timeout-minutes: 8
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq gcc-arm-linux-gnueabihf qemu-user busybox
      - uses: actions/download-artifact@v8
        with:
          name: cc2-camera-client-reap-r2
          run-id: 39297401612
          github-token: ${{ github.token }}
          path: /tmp/qualified-reap
      - uses: actions/download-artifact@v8
        with:
          name: cc2-camera-recovery-r2
          run-id: 39491902374
          github-token: ${{ github.token }}
          path: /tmp/qualified-recovery
      - name: Stage unchanged qualified camera runtime
        run: |
          python3 .github/scripts/package-builder-camera.py --stage-runtime
          python3 builder/current/prepare_camera.py
      - name: Rebuild stable application UI and canonical source pins
        run: |
          cd cc2-control/web-src
          npm ci
          npm run check
          npm run build
          cd ../..
          cp -a cc2-control/web/. cc2-control/firmware-integration/overlay/opt/usr/cc2-control/web/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cc2-control
          git diff --cached --quiet || git commit -m "Build stable Control 1.2.21 UI"
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current
          git diff --cached --quiet || git commit -m "Pin Control 1.2.21 sources for V4.4.2 firmware builder"
          git push origin HEAD:refs/heads/test/builder-4.4.2-control-1.2.21
      - name: Builder startup, migration and exact rollback tests
        run: |
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          python3 builder/current/launch_helpers/tests/test_launcher.py
          CC2_TEST_SHELL='busybox sh' python3 builder/current/tests/test_camera_firmware.py
          CC2_TEST_SHELL='busybox sh' python3 cc2-control/tests/test_camera_component.py
      - name: Application host and ARM qualification (no firmware built)
        working-directory: cc2-control
        run: |
          make clean test CROSS= CC=gcc EXTRA_CFLAGS=-Werror
          make clean all EXTRA_CFLAGS=-Werror
          CC2_TEST_RUNNER=qemu-arm python3 tests/test_smoke.py dist/cc2-control/cc2-control
      - name: Install browser for the unified application trial
        working-directory: cc2-control/web-src
        run: npx playwright install --with-deps chromium
      - name: Independent features, updater and accepted UI regressions
        working-directory: cc2-control/web-src
        run: |
          npm run test:experiments
          npm run test:motor-mode
          npm run test:updates
          npm run test:update-notice
          npm run test:canvas-states
          npm run test:canvas-layout
          npm run test:canvas-reset
          npm run test:spool-insertion
      - name: Package source builder with camera runtime and public provenance
        run: python3 .github/scripts/package-builder-camera.py --package
      - name: Package the same corrected application for a signed panel trial
        run: python3 cc2-control/installer/package.py --release --prepared cc2-control/dist/cc2-control --camera-runtime builder/current/components/camera/runtime
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cc2-builder-v4.4.2-control-1.2.21-unified-r3
          path: output/CC2-Builder-V4.4.2-Control-1.2.21-Test-R3.zip*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cc2-control-1.2.21-unified-candidate-r3
          path: output/CC2-Control-1.2.21-Multiplatform-Update.zip*
          retention-days: 14
          if-no-files-found: error
