name: Publish verified CC2 Control 1.2.22
on:
  push:
    branches: [publish/control-1.2.22]
    paths: [.github/workflows/publish-1222.yml]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Neme77/centauri-carbon-2-community
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: python3 experimental/release-publication/finalize.py
