name: Prepare Console nonmotion trial
on:
  push:
    branches: [fix/console-canvas-nonmotion]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/console-canvas-nonmotion'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove temporary workflow and refresh canonical source snapshot
        run: |
          git config user.name 'Neme77'
          git config user.email '59748679+Neme77@users.noreply.github.com'
          git rm .github/workflows/prepare-console-nonmotion.yml
          git commit -m 'Remove completed Console trial preparation workflow'
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          git commit -m 'Refresh builder source snapshot for Console homing classification'
          git push origin HEAD:fix/console-canvas-nonmotion
      - name: Builder snapshot regression
        run: python3 builder/current/tests/test_cc2_control_source_snapshot.py
      - name: Install ARM compiler and emulator
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user
      - name: Build and verify ARM application
        run: |
          make -C cc2-control clean all EXTRA_CFLAGS=-Werror
          CC2_TEST_RUNNER=qemu-arm python3 cc2-control/tests/test_smoke.py cc2-control/dist/cc2-control/cc2-control
      - name: Package application-only trial without camera reinstall
        run: |
          python3 cc2-control/installer/package.py --application-only-trial --prepared cc2-control/dist/cc2-control --output output/CC2-Control-1.2.22-Console-Nonmotion-Trial-R1.zip
          sha256sum output/CC2-Control-1.2.22-Console-Nonmotion-Trial-R1.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: console-nonmotion-trial-r1
          path: output/CC2-Control-1.2.22-Console-Nonmotion-Trial-R1.zip*
          if-no-files-found: error
