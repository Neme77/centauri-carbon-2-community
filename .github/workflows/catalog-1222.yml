name: Pin published Control 1.2.22 catalogue
on:
  push:
    branches: [release/control-1.2.22-catalog]
    paths: [.github/workflows/catalog-1222.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify published target before pinning catalogue
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib
          from pathlib import Path
          raw=Path('cc2-control/update-channel.cc2catalog').read_bytes()
          assert raw[:8]==b'CC2CAT1\n' and len(raw)<=8264
          index=json.loads(raw[72:])
          assert len(index['releases'])==2
          for e in index['releases']:
              assert e['version']=='1.2.22' and e['firmware']=='4.4'
              assert e['url']=='https://github.com/Neme77/centauri-carbon-2-community/releases/download/CC2-Control-1.2.22-V4.4/CC2-Control-1.2.22-V4.4.cc2update'
              b=urllib.request.urlopen(e['url'],timeout=60).read()
              assert len(b)==e['size'] and hashlib.sha256(b).hexdigest()=='ad215fbfb53b838f8f60c7f0e55b77fa10309e9c78f29c235691d2447c7caefb'
          print('Published package and catalogue routes verified')
          PY
      - name: Remove temporary action and synchronize exact source snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/catalog-1222.yml
          git commit -m 'Remove temporary catalogue synchronization action'
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current
          git commit -m 'Pin published 1.2.22 stable catalogue and legacy migration alias'
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          python3 cc2-control/tests/test_web_sync_static.py
          git push origin HEAD:refs/heads/release/control-1.2.22-catalog
